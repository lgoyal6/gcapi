---
swagger: '2.0'
info:
  version: 2.0.0
  title: GiveCampus Constituents API V2
  description: |-
    The Constituents API allows your school to securely send and retrieve constituent data in JSON format. <h2>Security</h2> <p>Every API request must have a bearer token attached in the Authorization header.</p> <p>These tokens are generated within the GiveCampus UI and only school administrators with super-user permissions can generate and manage them. You will choose this initial set of “full” administrators during the GiveCampus onboarding process.</p> <p>All API responses will be delivered over a secure HTTPS connection, and a TLS version of 1.2 or 1.3 is required.</p> <p>GiveCampus maintains detailed logs of API access and can provide them to your team upon request.</p> <h2>Request Lifecycle</h2> <p>The API delivers data asynchronously using a request-and-poll pattern:</p> <ol>
      <li><strong>Submit your request</strong> — Call the endpoint with your desired parameters. You'll receive a <code>request_id</code> and a <code>status</code> of <code>in_progress</code>.</li>
      <li><strong>Poll for results</strong> — Call <code>/results/{request_id}</code> every 2–5 seconds until <code>status</code> changes to <code>completed</code> (or <code>error</code>).</li>
      <li><strong>Download your data</strong> — When complete, the response includes a <code>download_url</code> containing a JSON array of objects matching the model defined below.</li>
    </ol> <p>Most requests complete within a few seconds.</p> <h2>Testing</h2> <p>You can use the tools below to see responses from the API to understand how to build your own implementation.</p> <p>You will see the URLs and paths necessary to make your own API calls.</p> <ol>
      <li>Click the Authorize button below to enter in your API Key in the following format: <code>Bearer API_TOKEN</code></li>
      <li>After authorized, you can click the close button in the authorization modal to start making requests</li>
      <li>Expand the Constituents section below to see the available parameters that you can leverage to filter API results.</li>
      <li>After requesting a subset of constituents, you will receive a <code>request_id</code>.  Copy that ID and then use that in the <code>results</code> section to see the progress of your request and to see the download URL once the request is completed.</li>
    </ol> <p>In the routes section below, there is a "Try it out" button.  After authenticating, you can select from the available parameters, and you will see the curl request performed, the results of your request, and any errors if applicable.</p> <p><i>GiveCampus Proprietary and Confidential</i></p>
basePath: "/api/v2"
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
    description: Enter the token with the `Bearer ` prefix, e.g. "Bearer XXXXXXXXXXXXX"
paths:
  "/constituents/search":
    post:
      tags:
      - Search for constituents
      summary: Search for constituents
      description: "<p>Retrieve a list of constituents based on various search criteria.</p>
        <p>gc_constituent_ids (optional) - Array of GiveCampus’s internal identifier</p>
        <p>ids (optional) -  Array of your external CRM’s identifier</p> <p>last_updated_at
        (optional) -  UTC Unix Timestamp of when constituent was last modified; if
        provided, the API will return all records updated on or after this timestamp</p>
        <p>emails (optional) - Array of emails that will search based on any of the
        known email addresses</p>"
      operationId: searchConstituents
      produces:
      - application/json
      parameters:
      - in: body
        required: true
        schema:
          type: object
          "$ref": "#/definitions/SearchConstituents"
      security:
      - Bearer: []
      responses:
        '200':
          description: Successfully retrieved constituents
          schema:
            "$ref": "#/definitions/ApiRequest"
        '400':
          description: Invalid request
          schema:
            "$ref": "./types/bad_request_error.yaml"
        '401':
          description: Unauthorized
          schema:
            "$ref": "./types/unauthorized_error.yaml"
        '500':
          description: Internal Server Error
          schema:
            "$ref": "./types/internal_server_error.yaml"
  "/constituents":
    post:
      tags:
      - Create constituents
      summary: Create constituents
      description: Batch create one or more constituents. Limited to 5000 records
        per request. Please make sure to include the `id` field for each constituent.
        Without the `id`, the constituent will not be created and will return an error.
        When adding email addresses, you can provide as many as you'd like. If you
        provide an email address whose `primary` field is set to `true`, it will be
        set as the **preferred email** for the constituent. If you provide an email
        address with an `email_type` of `business`, it will be set as the **business
        email** for the constituent. If you provide an email address with an `email_type`
        of `other`, it will be set as the **other email** for the constituent. These
        email types are case-insensitive. If you provide multiple email addresses
        with `email_type` `business` or `other`, the first one will be used.
      operationId: createConstituents
      produces:
      - application/json
      parameters:
      - in: body
        required: true
        schema:
          type: array
          items:
            "$ref": "#/definitions/CreateConstituent"
      security:
      - Bearer: []
      responses:
        '200':
          description: Successfully created constituents
          schema:
            "$ref": "#/definitions/ApiRequest"
        '400':
          description: Invalid request
          schema:
            "$ref": "./types/bad_request_error.yaml"
        '401':
          description: Unauthorized
          schema:
            "$ref": "./types/unauthorized_error.yaml"
        '500':
          description: Internal Server Error
          schema:
            "$ref": "./types/internal_server_error.yaml"
    put:
      tags:
      - Update constituents
      summary: Update constituents
      description: Batch update one or more constituents. Limited to 5000 records
        per request. Please make sure to include the `gc_constituent_id` field for
        each constituent. This field is the unique identifier for the constituent
        in GiveCampus. If you do not include this field, the constituent will not
        be updated and will return an error. Empty arrays for associated data will
        delete all records of that type. Only included data will be retained - omitted
        data will be deleted. When adding email addresses, you can provide as many
        as you'd like. If you provide an email address whose `primary` field is set
        to `true`, it will be set as the **preferred email** for the constituent.
        If you provide an email address with an `email_type` of `business`, it will
        be set as the **business email** for the constituent. If you provide an email
        address with an `email_type` of `other`, it will be set as the **other email**
        for the constituent. These email types are case-insensitive. If you provide
        multiple email addresses with `email_type` `business` or `other`, the first
        one will be used.
      operationId: updateConstituents
      produces:
      - application/json
      parameters:
      - in: body
        required: true
        schema:
          type: array
          items:
            "$ref": "#/definitions/UpdateConstituent"
      security:
      - Bearer: []
      responses:
        '200':
          description: Successfully updated constituents
          schema:
            "$ref": "#/definitions/ApiRequest"
        '400':
          description: Invalid request
          schema:
            "$ref": "./types/bad_request_error.yaml"
        '401':
          description: Unauthorized
          schema:
            "$ref": "./types/unauthorized_error.yaml"
        '500':
          description: Internal Server Error
          schema:
            "$ref": "./types/internal_server_error.yaml"
  "/results/{request_id}":
    get:
      tags:
      - Results
      summary: Get your results
      description: Returns the results of your request, like constituents
      operationId: findResults
      produces:
      - application/json
      parameters:
      - in: path
        name: request_id
        schema:
          type: string
        required: true
        description: Request ID
      security:
      - Bearer: []
      responses:
        '200':
          description: returns a status and download url for your request
          schema:
            "$ref": "#/definitions/ApiResults"
        '202':
          description: returns a status for your request
          schema:
            "$ref": "../shared/types/in_progress_api_results.yaml"
        '401':
          description: Unauthorized
          schema:
            "$ref": "./types/unauthorized_error.yaml"
        '404':
          description: Not Found
          schema:
            "$ref": "./types/not_found_error.yaml"
        '500':
          description: Internal Server Error
          schema:
            "$ref": "./types/internal_server_error.yaml"
definitions:
  SearchConstituents:
    type: object
    properties:
      gc_constituent_ids:
        type: array
        items:
          type: string
          format: uuid
        description: Array of GiveCampus's internal identifiers
        required: false
      ids:
        type: array
        items:
          type: string
          example: '39596819'
        description: Array of your external CRM's identifiers
        required: false
      last_updated_at:
        type: integer
        example: 1713805903
        description: UTC Unix Timestamp of when a constituent was last modified; if
          provided, the API will return all records updated on or after this timestamp
        required: false
      emails:
        type: array
        items:
          type: string
          format: email
        description: Array of emails that will search based on any of the known email
          addresses
        required: false
  CreateConstituent:
    allOf:
    - "$ref": "./types/constituent_base.yaml"
    - type: object
      required:
      - id
  UpdateConstituent:
    allOf:
    - type: object
      properties:
        gc_constituent_id:
          type: string
          format: uuid
      required:
      - gc_constituent_id
    - "$ref": "./types/constituent_base.yaml"
  Constituent:
    allOf:
    - "$ref": "./types/constituent_base.yaml"
    - type: object
      properties:
        gc_constituent_id:
          type: string
          format: uuid
  ApiRequest:
    "$ref": "../shared/types/api_request.yaml"
  ApiResults:
    "$ref": "../shared/types/api_results.yaml"
