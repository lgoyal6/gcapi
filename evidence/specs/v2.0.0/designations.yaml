---
swagger: '2.0'
info:
  version: 2.0.0
  title: GiveCampus Designations API V2
  description: |-
    The Designations API allows your school to securely retrieve and manage designation data in JSON format. You can request a list of your school's designations, create new designations, and update existing ones. <h2>Security</h2> <p>Every API request must have a bearer token attached in the Authorization header.</p> <p>These tokens are generated within the GiveCampus UI and only school administrators with super-user permissions can generate and manage them. You will choose this initial set of “full” administrators during the GiveCampus onboarding process.</p> <p>All API responses will be delivered over a secure HTTPS connection, and a TLS version of 1.2 or 1.3 is required.</p> <p>GiveCampus maintains detailed logs of API access and can provide them to your team upon request.</p> <h2>Request Lifecycle</h2> <p>The API delivers data asynchronously using a request-and-poll pattern:</p> <ol>
      <li><strong>Submit your request</strong> — Call the endpoint with your desired parameters. You'll receive a <code>request_id</code> and a <code>status</code> of <code>in_progress</code>.</li>
      <li><strong>Poll for results</strong> — Call <code>/results/{request_id}</code> every 2–5 seconds until <code>status</code> changes to <code>completed</code> (or <code>error</code>).</li>
      <li><strong>Download your data</strong> — When complete, the response includes a <code>download_url</code> containing a JSON array of objects matching the model defined below.</li>
    </ol> <p>Most requests complete within a few seconds.</p> <h2>What's new in V2</h2> <ul>
      <li><strong>Hiding a designation now removes it from giving forms.</strong> Setting <code>visible</code> to <code>false</code> hides the designation at the school level <em>and</em> automatically removes it from any campaigns and giving forms where it currently appears. In V1 these had to be removed manually.</li>
      <li><strong>Clearer duplicate errors.</strong> When a create or update collides with an existing designation, the error message now identifies the conflicting designation by ID so you can resolve it directly.</li>
    </ul> <h2>Testing</h2> <p>You can use the tools below to see responses from the API to understand how to build your own implementation.</p> <p>You will see the URLs and paths necessary to make your own API calls.</p> <ol>
      <li>Click the Authorize button below to enter in your API Key in the following format: <code>Bearer API_TOKEN</code></li>
      <li>After authorized, you can click the close button in the authorization modal to start making requests</li>
      <li>Expand the Designations section below to see the available parameters that you can leverage to filter API results.</li>
      <li>After requesting a subset of designations, you will receive a <code>request_id</code>.  Copy that ID and then use that in the <code>results</code> section to see the progress of your request and to see the download URL once the request is completed.</li>
    </ol> <p>In the routes section below, there is a "Try it out" button.  After authenticating, you can select from the available parameters, and you will see the curl request performed, the results of your request, and any errors if applicable.</p> <p><i>GiveCampus Proprietary and Confidential</i></p>
basePath: "/api/v2"
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
    description: Enter the token with the `Bearer ` prefix, e.g. "Bearer XXXXXXXXXXXXX".
paths:
  "/designations":
    get:
      tags:
      - Retrieve a list of designations
      summary: Find your designations
      description: |-
        <p>This endpoint will submit a request to retrieve designations based on the supplied parameters.</p> <p>The results of this request is a JSON object that contains the following:</p>
          <ol>
            <li>request_id</li>
            <li>state</li>
          </ol>
        <p>Once you receive the <code>request_id</code>, you can make a subsequent request to the <code>results</code> operation listed on this page.</p> <p>You will take this id to check the <code>state</code> of the request and once it is <code>completed</code> you will have a valid <code>download_url</code> that will contain the data from the original designations request.</p>
      operationId: findDesignations
      produces:
      - application/json
      parameters:
      - name: ids
        in: query
        description: "(optional) A comma separated list of GiveCampus Designation
          IDs to filter the response by"
        required: false
        type: string
      security:
      - Bearer: []
      responses:
        '200':
          description: returns a request id that can be used to make further requests
          schema:
            "$ref": "#/definitions/ApiRequest"
        '400':
          description: Invalid request
          schema:
            "$ref": "./types/bad_request_error.yaml"
        '401':
          description: Unauthorized
          schema:
            "$ref": "./types/unauthorized_error.yaml"
        '500':
          description: Internal Server Error
          schema:
            "$ref": "./types/internal_server_error.yaml"
    post:
      tags:
      - Bulk-create designations for your school
      summary: Create designations
      description: |-
        <p>This endpoint allows you to create designations.</p> <p>
          <strong>IMPORTANT: Submitting this request will create a real designation for your school such that anyone reviewing designations will see it in the GiveCampus system.</strong>
        </p> <p>
          <strong>Please ensure that your team is aware of any API requests submitted using this tool, and can delete after testing.</strong>
        </p> <p><strong>Note:</strong> You can only create up to 5,000 designations per request.</p> <p><strong>Duplicate handling:</strong> If a designation with the same <code>name</code>, <code>unique_identifier</code>, and <code>write_in</code> value already exists, that row is rejected and its <code>errors</code> array will contain a message identifying the existing record, e.g. <code>"Name and backend and writein has already been taken by designation ID: 100"</code>. Use the referenced ID to locate and update the existing designation rather than creating a new one.</p>
      operationId: createDesignations
      produces:
      - application/json
      parameters:
      - in: body
        name: Designation Details
        schema:
          type: array
          items:
            description: |-
              Here are the following keys that are available to create a designation.
                * name (required) - Name of the designation that the donor will see
                * description - Description of the designation that the donor will see
                * unique_identifier - Backend identifier for the designation.
                * write_in - Does this designation allow for write in values? Defaults to `false` if omitted.
            type: object
            required:
            - name
            properties:
              name:
                example: Designation created during API Testing
                type: string
              description:
                example: Designation description created during API Testing
                type: string
              unique_identifier:
                example: TEST000
                type: string
              write_in:
                example: true
                type: boolean
                default: false
      security:
      - Bearer: []
      responses:
        '200':
          description: returns a request id that can be used to make further requests
          schema:
            "$ref": "#/definitions/ApiRequest"
        '400':
          description: Invalid request
          schema:
            "$ref": "./types/bad_request_error.yaml"
        '401':
          description: Unauthorized
          schema:
            "$ref": "./types/unauthorized_error.yaml"
        '500':
          description: Internal Server Error
          schema:
            "$ref": "./types/internal_server_error.yaml"
    put:
      tags:
      - Bulk-update designations for your school
      summary: Update designations
      description: |-
        <p>This endpoint allows you to update designations.</p> <p>
          <strong>IMPORTANT: Submitting this request will update designations for your school such that anyone reviewing designations will see the updates in the GiveCampus system.</strong>
        </p> <p><strong>Note:</strong> You can only update up to 5,000 designations per request.</p> <p><strong>Hiding a designation (<code>visible: false</code>):</strong> Setting the <code>visible</code> property to <code>false</code> hides the designation at the school level <em>and</em> automatically removes it from any campaigns and giving forms where it currently appears, so it will no longer display to donors. This is a change from V1, where hidden designations had to be removed from campaigns and giving forms manually. Removal from giving forms happens asynchronously after the update completes.</p> <p><strong>Duplicate handling:</strong> If your update would collide with another designation that has the same <code>name</code>, <code>unique_identifier</code>, and <code>write_in</code> value, that row is rejected and its <code>errors</code> array will contain a message identifying the existing record, e.g. <code>"Name and backend and writein has already been taken by designation ID: 100"</code>.</p> <p><strong>Optional fields:</strong> Only <code>id</code> and <code>name</code> are required. Any of <code>description</code>, <code>unique_identifier</code>, <code>visible</code>, and <code>write_in</code> may be omitted. Omitting <code>visible</code> or <code>write_in</code> leaves the existing value unchanged; omitting <code>description</code> or <code>unique_identifier</code> clears that value.</p>
      operationId: updateDesignations
      produces:
      - application/json
      parameters:
      - name: update_existing_gifts
        in: query
        description: If set to true, this parameter will update any existing gifts
          with the updated values for your designations.  If you wish to keep past
          gifts with the donor's chosen designation, leave this parameter off the
          query, or pass it through as `false`
        required: false
        type: boolean
        default: false
      - name: simplified
        in: query
        description: If set to true, the response will contain a simplified version
          of the designation object with only the most essential fields.
        required: false
        type: boolean
        default: false
      - in: body
        name: Designation Details
        schema:
          type: array
          items:
            description: |-
              The keys available when updating a designation.
                * id (required) - GiveCampus ID for the designation being updated
                * name (required) - Name of the designation that the donor will see
                * description - Description of the designation that the donor will see
                * unique_identifier - Backend identifier for the designation.
                * visible - Is the designation visible for donors? Setting this to `false` removes the designation from giving forms.
                * write_in - Does this designation allow for write in values?
            type: object
            required:
            - id
            - name
            properties:
              id:
                example: 100
                type: integer
              name:
                example: Designation Name
                type: string
              description:
                example: Designation description
                type: string
              unique_identifier:
                example: TEST000
                type: string
              visible:
                example: true
                type: boolean
              write_in:
                example: true
                type: boolean
      security:
      - Bearer: []
      responses:
        '200':
          description: returns a request id that can be used to make further requests
          schema:
            "$ref": "#/definitions/ApiRequest"
        '400':
          description: Invalid request
          schema:
            "$ref": "./types/bad_request_error.yaml"
        '401':
          description: Unauthorized
          schema:
            "$ref": "./types/unauthorized_error.yaml"
        '500':
          description: Internal Server Error
          schema:
            "$ref": "./types/internal_server_error.yaml"
  "/results/{request_id}":
    get:
      tags:
      - Results
      summary: Get your results
      description: Returns the results of your request, like designations
      operationId: findResults
      produces:
      - application/json
      parameters:
      - in: path
        name: request_id
        schema:
          type: string
        required: true
        description: Request ID
      security:
      - Bearer: []
      responses:
        '200':
          description: returns a status and download url for your request
          schema:
            "$ref": "#/definitions/ApiResults"
        '202':
          description: returns a status for your request
          schema:
            "$ref": "../shared/types/in_progress_api_results.yaml"
        '401':
          description: Unauthorized
          schema:
            "$ref": "./types/unauthorized_error.yaml"
        '404':
          description: Not Found
          schema:
            "$ref": "./types/not_found_error.yaml"
        '500':
          description: Internal Server Error
          schema:
            "$ref": "./types/internal_server_error.yaml"
definitions:
  GetDesignations:
    description: The following fields are returned per designation in an array in
      the downloaded file from the Designations API
    "$ref": "../v1.0.0/designation_object.yaml"
  PostDesignations:
    description: The following fields are returned per designation in an array to
      confirm the designations created.
    type: object
    properties:
      error_count:
        description: If any errors, the number will be reported in this field.
        type: integer
      items:
        description: The designations created will be returned in an array for review.
          Rejected rows include an `errors` array describing why they failed.
        type: array
        items:
          "$ref": "../v1.0.0/designation_object.yaml"
  PutDesignations:
    description: The following fields are returned per designation in an array to
      confirm the designations updated.
    type: object
    properties:
      error_count:
        description: If any errors, the number will be reported in this field.
        type: integer
      items:
        description: The designations updated will be returned in an array for review.
          Rejected rows include an `errors` array describing why they failed.
        type: array
        items:
          "$ref": "../v1.0.0/designation_object.yaml"
  ApiRequest:
    "$ref": "../shared/types/api_request.yaml"
  ApiResults:
    "$ref": "../shared/types/api_results.yaml"
