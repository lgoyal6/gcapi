---
swagger: '2.0'
info:
  version: 1.0.0
  title: GiveCampus Recurring Gifts API
  description: |-
    The Recurring Subscription API allows your school to retrieve a collection of recurring subscription records in JSON format. <h2>Security</h2> <p>Every API request must have a bearer token attached in the Authorization header.</p> <p>These tokens are generated within the GiveCampus UI and only school administrators with super-user permissions can generate and manage them. You will choose this initial set of “full” administrators during the GiveCampus onboarding process.</p> <p>All API responses will be delivered over a secure HTTPS connection, and a TLS version of 1.2 or 1.3 is required.</p> <p>GiveCampus maintains detailed logs of API access and can provide them to your team upon request.</p> <h2>Request Lifecycle</h2> <p>The API delivers data asynchronously using a request-and-poll pattern:</p> <ol>
      <li><strong>Submit your request</strong> — Call the endpoint with your desired parameters. You'll receive a <code>request_id</code> and a <code>status</code> of <code>in_progress</code>.</li>
      <li><strong>Poll for results</strong> — Call <code>/results/{request_id}</code> every 2–5 seconds until <code>status</code> changes to <code>completed</code> (or <code>error</code>).</li>
      <li><strong>Download your data</strong> — When complete, the response includes a <code>download_url</code> containing a JSON array of objects matching the model defined below.</li>
    </ol> <p>Most requests complete within a few seconds.</p> <h2>Testing</h2> <p>You can use the tools below to see responses from the API to understand how to build your own implementation.</p> <p>You will see the URLs and paths necessary to make your own API calls.</p> <ol>
      <li>Click the Authorize button below to enter in your API Key in the following format: <code>Bearer API_TOKEN</code></li>
      <li>After authorized, you can click the close button in the authorization modal to start making requests</li>
      <li>Expand either of the Recurring Subscription sections below to see the available parameters that you can leverage to filter API results.</li>
      <li>After requesting a subset of recurring subscriptions, you will receive a <code>request_id</code>.  Copy that ID and then use that in the <code>results</code> section to see the progress of your request and to see the download URL once the request is completed.</li>
    </ol> <p>In the routes section below, there is a "Try it out" button.  After authenticating, you can select from the available parameters, and you will see the curl request performed, the results of your request, and any errors if applicable.</p> <p><i>GiveCampus Proprietary and Confidential</i></p>
basePath: "/api"
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
    description: Enter the token with the `Bearer ` prefix, e.g. "Bearer XXXXXXXXXXXXX".
paths:
  "/recurring_subscriptions":
    get:
      tags:
      - All Recurring Subscriptions
      summary: Find your recurring subscriptions
      description: |-
        <p>This endpoint will submit a request to retrieve recurring subscriptions</p> <p>The results of this request is a JSON object that contains the following:</p>
          <ol>
            <li>request_id</li>
            <li>state</li>
          </ol>
        <p>Once you receive the <code>request_id</code>, you can make a subsequent request to the <code>results</code> operation listed on this page.</p> <p>You will take this id to check the <code>state</code> of the request and once it is <code>completed</code> you will have a valid <code>download_url</code> that will contain the data from the original gifts request</p>
      operationId: findRecurringSubscriptions
      produces:
      - application/json
      parameters:
      - name: time_field
        in: query
        description: Optional parameter to specify the field by which the start and
          end date will filter
        required: false
        type: string
        enum:
        - canceled_on
        - created_at
        - end_date
        - last_run_date
        - next_run_date
        - reactivated_at
        - updated_at
        - updated_run_date
      - name: start
        in: query
        description: Start timestamp of the desired time range (in a Unix time format).
          Required if <code>time_field</code> has been passed.
        required: false
        type: integer
      - name: end
        in: query
        description: End timestamp of the desired time range (in Unix time). Required
          if <code>time_field</code> has been passed.
        required: false
        type: integer
      - name: ids
        in: query
        description: A comma separated list of Recurring Subscription IDs to filter
          the response by
        required: false
        type: string
      - name: constituent_ids
        in: query
        description: A comma separated list of Constituent IDs (from your system)
          to filter the response by
        required: false
        type: string
      security:
      - Bearer: []
      responses:
        '200':
          description: returns a request id that can be used to make further requests
          schema:
            "$ref": "#/definitions/ApiRequest"
        '400':
          description: Invalid request
  "/recurring_subscriptions/{subscription_id}":
    get:
      tags:
      - Recurring Subscription by ID
      summary: Find a recurring subscription by its unique GC ID
      description: |-
        <p>This endpoint will submit a request to retrieve recurring subscription by a specific GiveCampus subscription ID</p> <p>The results of this request is a JSON object that contains the following:</p>
          <ol>
            <li>request_id</li>
            <li>state</li>
          </ol>
        <p>Once you receive the <code>request_id</code>, you can make a subsequent request to the <code>results</code> operation listed on this page.</p> <p>You will take this id to check the <code>state</code> of the request and once it is <code>completed</code> you will have a valid <code>download_url</code> that will contain the data from the original gifts request</p>
      operationId: findRecurringSubscriptionById
      produces:
      - application/json
      parameters:
      - in: path
        name: subscription_id
        schema:
          type: string
        required: true
        description: Subscription ID
      security:
      - Bearer: []
      responses:
        '200':
          description: returns a request id that can be used to make further requests
          schema:
            "$ref": "#/definitions/ApiRequest"
        '400':
          description: Invalid request
  "/results/{request_id}":
    get:
      tags:
      - Results
      summary: Get your results
      description: Returns the results of your request
      operationId: findResults
      produces:
      - application/json
      parameters:
      - in: path
        name: request_id
        schema:
          type: string
        required: true
        description: Request ID
      security:
      - Bearer: []
      responses:
        '200':
          description: returns a status and download url for your request
          schema:
            "$ref": "#/definitions/ApiResults"
        '202':
          description: returns a status for your request
          schema:
            "$ref": "../shared/types/in_progress_api_results.yaml"
        '400':
          description: Invalid request
definitions:
  RecurringSubscriptions:
    description: The following fields are returned per recurring subscription in an
      array in the downloaded file from the Recurring Subscriptions API
    type: object
    properties:
      cancel_reason:
        description: A message explaining why the subscription was cancelled.
        type: string
      constituent_id:
        description: Constituent identifier associated with the subscription.
        type: string
      custom_fields:
        description: A hash of every custom field key collected across all of the
          school's contributions, populated from the subscription's originating contribution's
          additional fields. Keys are present for every field seen across the school;
          values are null when the subscription's contribution does not include that
          field.
        type: object
        additionalProperties:
          type: string
          x-nullable: true
        example:
          first_name: Ada
          last_name: Lovelace
      designations:
        description: The designation selected by the donor
        type: array
        items:
          type: object
          properties:
            id:
              description: The GiveCampus unique identifier for the designation.
              type: integer
            name:
              description: The name of the designation selected by the donor.
              type: string
            amount:
              description: The amount of the gift applied to this designation. This
                will be a percentage of the total amount if multiple designations
                are selected.
              type: string
            unique_identifier:
              description: The backend ID, defined by the partner, for the donor selected
                designation
              type: string
            write_in:
              description: The text entered by the donor if they select a designation
                that allows a write in value.
              type: string
      failure_reason:
        description: A message explaining why the last payment for the subscription
          failed.
        type: string
      frequency:
        description: |-
          How often is the subscription being charged.
            * monthly (for a number of years)
            * limited_monthly (for a number of months)
            * yearly
        type: string
        enum:
        - monthly
        - limited_monthly
        - yearly
      id:
        description: GiveCampus ID for the subscription
        type: integer
      installment_amount:
        description: Dollar amount to be charged for each upcoming installment. This
          amount can be modified by administrators in the middle of a donor's recurring
          pledge, so you should not expect every installment to be for the same dollar
          amount.
        type: string
      installments:
        type: array
        items:
          type: object
          properties:
            currency:
              description: Short code for the currency of the gift (USD, CAD etc.).
              type: string
            designations:
              description: The designation selected by the donor
              type: array
              items:
                type: object
                properties:
                  name:
                    description: The name of the designation selected by the donor.
                    type: string
                  amount:
                    description: The amount of the gift applied to this designation.
                      This will be a percentage of the total amount if multiple designations
                      are selected.
                    type: string
                  unique_identifier:
                    description: The backend ID, defined by the partner, for the donor
                      selected designation
                    type: string
                  write_in:
                    description: The text entered by the donor if they select a designation
                      that allows a write in value.
                    type: string
            id:
              description: GiveCampus ID for the installment
              type: integer
            state:
              description: The current state of the subscription
              type: string
              enum:
              - authorized
              - failed
              - paid
              - pending
              - refunded
            timestamps:
              type: object
              properties:
                captured_at:
                  description: Capture timestamp in Unix time. This represents the
                    payment success confirmation from Stripe/PayPal.
                  type: integer
                checkout_at:
                  description: Checkout timestamp in Unix time. This represents the
                    moment a school's payment processor initiated a charge against
                    the donor's credit card or bank account.
                  type: integer
                created_at:
                  description: Created At timestamp in Unix time.  This represents
                    when the installment was created.
                  type: integer
                datetime_of_pledge:
                  description: Datetime of Pledge in Unix time. This represents the
                    time the payment form was submitted.
                  type: integer
                deposited_at:
                  description: Deposit confirmation timestamp from Stripe/PayPal in
                    Unix time.
                  type: integer
                refunded_at:
                  description: Refund timestamp from Stripe/PayPal in Unix time.
                  type: integer
                updated_at:
                  description: Updated At timestamp in Unix Time.  This is the last
                    time that the installment was updated.
                  type: integer
            value:
              description: Dollar amount charged for the installment
              type: string
              example: 10.0
      max_charges:
        description: The max number of charges to be collected. For indefinitely recurring
          gifts, this will return null.
        type: integer
        example: 10
      payer_email:
        description: The email entered by the donor on the prepayment form.
        type: string
        example: kestrel@givecampus.com
      payer_name:
        description: The name entered by the donor on the prepayment form. If the
          name field is expanded into multiple fields, the concatenated name will
          show here.
        type: string
        example: Kestrel Linder
      payment:
        type: object
        properties:
          processor:
            description: The name of the payment processing setup used for the subscription.
            type: string
            enum:
            - CyberSource
            - Stripe
            - Spreedly
            - TouchNet
            - WePay
          type:
            type: string
            enum:
            - card
      recurs_indefinitely:
        description: True/False value for whether or not the charge is considered
          ongoing without an end date.
        type: boolean
      state:
        type: string
        enum:
        - active
        - canceled
        - card_expired
        - ended
        - recurring_failed
        - no payment - pledge subscriptions without payment information
        - scheduled - pledge subscriptions that have not yet started
      subscription_type:
        description: Value for knowing the type of recurring subscription.
        type: string
        enum:
        - donation
        - pledge
      timestamps:
        type: object
        properties:
          canceled_on:
            description: Canceled On timestamp in Unix time.  Represents when the
              subscription was cancelled
            type: integer
          created_at:
            description: Created At timestamp in Unix time.  Represents when the subscription
              was created
            type: integer
          end_date:
            description: Created At Date.  Represents the subscriptions end date.
            type: string
            example: '2020-05-10'
          last_run_date:
            description: Last Run Date.  Represents the date of the most recent payment
              for the subscription.
            type: string
            example: '2023-02-22'
          next_run_date:
            description: Next Run Date.  Represents the date of the next payment for
              the subscription.
            type: string
            example: '2018-05-10'
          reactivated_at:
            description: Reactivated At timestamp in Unix time.  If the subscription
              was ever stopped then restarted, this is the date the subscription was
              reactivated.
            type: integer
          updated_run_date:
            description: Updated Run Date.  If the original run date was updated,
              the value will be noted here
            type: string
            example: '2018-05-10'
          updated_at:
            description: Updated At timestamp in Unix time.  The last time that the
              plan was updated.
            type: integer
      total:
        description: The total dollar amount paid once all installments have been
          charged. For indefinitely recurring subscriptions, this will return null.
        type: string
        example: '100.00'
      total_charges:
        description: The total number of charges accrued so far.
        type: integer
      total_paid:
        description: The total dollar amount paid so far.
        type: string
        example: '20.00'
      total_remaining:
        description: The total dollar amount remaining to be charged.
        type: string
        example: '80.00'
      user:
        type: object
        properties:
          id:
            description: GiveCampus ID for the user who created the subscription
            type: integer
          name:
            description: The user's name or "guest" if the user was not logged in
              at the time that the subscription was created.
            type: string
      zipcode:
        description: Zipcode for the user who created the subscription.
        type: string
  ApiRequest:
    "$ref": "../shared/types/api_request.yaml"
  ApiResults:
    "$ref": "../shared/types/api_results.yaml"
