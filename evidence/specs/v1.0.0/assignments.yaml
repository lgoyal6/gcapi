---
swagger: '2.0'
info:
  version: 1.0.0
  title: GiveCampus Assignments API (Beta)
  description: |-
    The Assignments API allows your school to sync gift officer portfolio assignments to and from GiveCampus in JSON format. An assignment connects a constituent to a gift officer's fundraising portfolio under a named assignment type (for example, "Primary" or "Secondary"). <h2>Beta</h2> <p>This API is currently in <strong>Beta</strong>. The interface may change while we confirm successful usage with early partners. Please contact your GiveCampus representative before integrating.</p> <h2>Security</h2> <p>All requests require a bearer token via the Authorization header, generated by a school administrator with super-user permissions in the GiveCampus UI.</p> <p>All API responses are delivered over HTTPS and require TLS 1.2 or 1.3.</p> <p>GiveCampus maintains detailed logs of API access and can provide them to your team upon request.</p> <h2>Request Lifecycle</h2> <p>The API delivers data asynchronously using a request-and-poll pattern:</p> <ol>
      <li><strong>Submit your request</strong> — Call the endpoint with your desired body. You'll receive a <code>request_id</code> and a <code>status</code> of <code>in_progress</code> (HTTP <code>202 Accepted</code>).</li>
      <li><strong>Poll for results</strong> — Call <code>/results/{request_id}</code> every 2–5 seconds until <code>status</code> changes to <code>completed</code> (or <code>error</code>).</li>
      <li><strong>Download your data</strong> — When complete, the response includes a <code>download_url</code> containing the JSON result for your request.</li>
    </ol> <p>Most requests complete within a few seconds.</p> <h2>Testing</h2> <p>Use the "Try it out" button to test and inspect API behavior before integrating.</p> <p><i>GiveCampus Proprietary and Confidential</i></p>
basePath: "/api"
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
    description: Enter the token with the `Bearer ` prefix, e.g. "Bearer XXXXXXXXXXXXX".
paths:
  "/assignments":
    put:
      tags:
      - Assignments
      summary: Create or update assignments
      description: Synchronizes the set of constituent assignments for one or more
        gift officers. The request body is a JSON array of items; each item declares
        a primary gift officer and the full set of constituents assigned to that gift
        officer's portfolio. <p><strong>This is a replace-and-sweep (upsert) operation,
        not an append.</strong> For each gift officer's portfolio, GiveCampus creates
        or restores the assignments you send, leaves unchanged ones as-is, and soft-deletes
        any existing assignment in that portfolio that is not present in your request.
        Always send the complete intended set of assignments for each gift officer.</p>
        <p>Gift officers and assignment types are created automatically if they do
        not already exist. Constituents must already exist and are matched by external
        ID. Limited to 5,000 constituents total per request (summed across all items).</p>
        <p>Poll <code>/results/{request_id}</code> for the outcome; the downloaded
        payload matches the <code>AssignmentWriteResult</code> model below.</p>
      operationId: upsertAssignments
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - in: body
        name: assignments
        required: true
        schema:
          type: array
          items:
            "$ref": "#/definitions/AssignmentUpsertItem"
      security:
      - Bearer: []
      responses:
        '202':
          description: Submitted successfully. Returns a request ID.
          schema:
            "$ref": "#/definitions/ApiRequest"
        '400':
          description: Invalid request
          schema:
            "$ref": "../v2.0.0/types/bad_request_error.yaml"
        '401':
          description: Unauthorized
          schema:
            "$ref": "../v2.0.0/types/unauthorized_error.yaml"
        '404':
          description: Not Found
          schema:
            "$ref": "../v2.0.0/types/not_found_error.yaml"
        '500':
          description: Internal Server Error
          schema:
            "$ref": "../v2.0.0/types/internal_server_error.yaml"
  "/assignments/search":
    post:
      tags:
      - Assignments
      summary: Search assignments
      description: Returns existing gift officer portfolio assignments matching the
        supplied filters. All filters are optional and combined with AND logic; sending
        an empty object returns all assignments. Only active (non-deleted) gift officer
        assignments are returned. Any key other than the supported filters is rejected
        with <code>400 Bad Request</code>. <p>Poll <code>/results/{request_id}</code>
        for the outcome; the downloaded payload is a JSON array of <code>Assignment</code>
        objects (model below).</p>
      operationId: searchAssignments
      consumes:
      - application/json
      produces:
      - application/json
      parameters:
      - in: body
        name: search_request
        required: true
        schema:
          "$ref": "#/definitions/AssignmentSearchRequest"
      security:
      - Bearer: []
      responses:
        '202':
          description: Submitted successfully. Returns a request ID.
          schema:
            "$ref": "#/definitions/ApiRequest"
        '400':
          description: Invalid request
          schema:
            "$ref": "../v2.0.0/types/bad_request_error.yaml"
        '401':
          description: Unauthorized
          schema:
            "$ref": "../v2.0.0/types/unauthorized_error.yaml"
        '404':
          description: Not Found
          schema:
            "$ref": "../v2.0.0/types/not_found_error.yaml"
        '500':
          description: Internal Server Error
          schema:
            "$ref": "../v2.0.0/types/internal_server_error.yaml"
  "/results/{request_id}":
    get:
      tags:
      - Results
      summary: Get your results
      description: Returns the status of a previously submitted request, and a download
        URL once it is complete. This is the shared results endpoint used by all GiveCampus
        asynchronous APIs.
      operationId: getAssignmentResults
      produces:
      - application/json
      parameters:
      - in: path
        name: request_id
        type: string
        required: true
        description: Request ID returned from submission.
      security:
      - Bearer: []
      responses:
        '200':
          description: Status and download URL
          schema:
            "$ref": "#/definitions/ApiResults"
        '202':
          description: Status of your request
          schema:
            "$ref": "../shared/types/in_progress_api_results.yaml"
        '401':
          description: Unauthorized
          schema:
            "$ref": "../v2.0.0/types/unauthorized_error.yaml"
        '404':
          description: Not Found
          schema:
            "$ref": "../v2.0.0/types/not_found_error.yaml"
        '500':
          description: Internal Server Error
          schema:
            "$ref": "../v2.0.0/types/internal_server_error.yaml"
definitions:
  AssignmentUpsertItem:
    type: object
    required:
    - primary_gift_officer
    - constituents
    properties:
      primary_gift_officer:
        type: object
        required:
        - external_id
        properties:
          external_id:
            type: string
            description: Your system's identifier for the gift officer who owns the
              portfolio.
            example: GO-1
      constituents:
        type: array
        description: The full set of constituents to assign to this gift officer's
          portfolio.
        items:
          type: object
          required:
          - external_id
          - assignment_type_name
          properties:
            external_id:
              type: string
              description: Your system's identifier for the constituent. Must match
                an existing constituent.
              example: C-001
            assignment_type_name:
              type: string
              description: The assignment type name. Matched exactly; created automatically
                if it does not exist.
              example: Primary
  AssignmentSearchRequest:
    type: object
    description: All filters are optional and combined with AND logic.
    properties:
      constituent_external_ids:
        type: array
        items:
          type: string
        description: Filter by constituent external IDs.
      gift_officer_external_ids:
        type: array
        items:
          type: string
        description: Filter by gift officer external IDs.
      assignment_type_names:
        type: array
        items:
          type: string
        description: Filter by assignment type names.
      updated_at_start:
        type: integer
        description: Only assignments updated on or after this time (Unix timestamp
          in seconds).
      updated_at_end:
        type: integer
        description: Only assignments updated on or before this time (Unix timestamp
          in seconds).
  Assignment:
    type: object
    description: Response object returned in the search results download (an array
      of these).
    properties:
      id:
        type: integer
        description: The assignment's internal GiveCampus ID.
      constituent:
        type: object
        properties:
          id:
            type: integer
          external_id:
            type: string
      primary_gift_officer:
        type: object
        properties:
          id:
            type: integer
          external_id:
            type: string
          email:
            type: string
      fundraising_portfolio:
        type: object
        properties:
          id:
            type: integer
          name:
            type: string
      assignment_type:
        type: object
        properties:
          id:
            type: integer
          name:
            type: string
      timestamps:
        type: object
        properties:
          created_at:
            type: integer
            description: Unix timestamp in seconds.
          updated_at:
            type: integer
            description: Unix timestamp in seconds.
  AssignmentWriteResult:
    type: object
    description: Response object returned in the PUT /assignments results download.
    properties:
      items:
        type: array
        items:
          type: object
          properties:
            primary_gift_officer:
              type: object
              properties:
                external_id:
                  type: string
                id:
                  type: integer
                email:
                  type: string
            fundraising_portfolio:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
            created_count:
              type: integer
            restored_count:
              type: integer
            unchanged_count:
              type: integer
            deleted_count:
              type: integer
              description: Number of assignments soft-deleted by the replace-and-sweep
                operation.
            constituents:
              type: array
              items:
                type: object
                properties:
                  external_id:
                    type: string
                  id:
                    type: integer
                  assignment_type:
                    type: object
                    properties:
                      id:
                        type: integer
                      name:
                        type: string
                  fundraising_portfolio_person:
                    type: object
                    properties:
                      id:
                        type: integer
                      deleted_at:
                        type: string
                        description: Null unless the assignment is soft-deleted.
                  person:
                    type: object
                    properties:
                      id:
                        type: integer
                      external_id:
                        type: string
                  result:
                    type: string
                    enum:
                    - created
                    - restored
                    - unchanged
                    - failed
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          enum:
                          - invalid_data
                          - record_not_found
                        message:
                          type: string
            errors:
              type: array
              description: Item-level errors. When present, every constituent in the
                item is marked failed.
              items:
                type: object
                properties:
                  code:
                    type: string
                    enum:
                    - invalid_data
                    - record_not_found
                  message:
                    type: string
      error_count:
        type: integer
        description: Total number of failures across the response.
  ApiRequest:
    type: object
    properties:
      request_id:
        type: string
      status:
        type: string
        enum:
        - in_progress
        - completed
        - error
  ApiResults:
    type: object
    properties:
      status:
        type: string
        enum:
        - completed
        - error
        - in_progress
      download_url:
        type: string
