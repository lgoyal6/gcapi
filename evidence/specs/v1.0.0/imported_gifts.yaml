---
swagger: '2.0'
info:
  version: 1.0.0
  title: GiveCampus Imported Gifts API
  description: |-
    The Imported Gifts API allows your school to securely retrieve imported gift data in JSON format. <h2>Security</h2> <p>Every API request must have a bearer token attached in the Authorization header.</p> <p>These tokens are generated within the GiveCampus UI and only school administrators with super-user permissions can generate and manage them. You will choose this initial set of “full” administrators during the GiveCampus onboarding process.</p> <p>All API responses will be delivered over a secure HTTPS connection, and a TLS version of 1.2 or 1.3 is required.</p> <p>GiveCampus maintains detailed logs of API access and can provide them to your team upon request.</p> <h2>Request Lifecycle</h2> <p>The API delivers data asynchronously using a request-and-poll pattern:</p> <ol>
      <li><strong>Submit your request</strong> — Call the endpoint with your desired parameters. You'll receive a <code>request_id</code> and a <code>status</code> of <code>in_progress</code>.</li>
      <li><strong>Poll for results</strong> — Call <code>/results/{request_id}</code> every 2–5 seconds until <code>status</code> changes to <code>completed</code> (or <code>error</code>).</li>
      <li><strong>Download your data</strong> — When complete, the response includes a <code>download_url</code> containing a JSON array of objects matching the model defined below.</li>
    </ol> <p>Most requests complete within a few seconds.</p> <h2>Testing</h2> <p>You can use the tools below to see responses from the API to understand how to build your own implementation.</p> <p>You will see the URLs and paths necessary to make your own API calls.</p> <ol>
      <li>Click the Authorize button below to enter in your API Key in the following format: <code>Bearer API_TOKEN</code></li>
      <li>After authorized, you can click the close button in the authorization modal to start making requests</li>
      <li>Expand the Imported Gifts section below to see the available parameters that you can leverage to filter API results.</li>
      <li>After requesting a subset of imported gifts, you will receive a <code>request_id</code>.  Copy that ID and then use that in the <code>results</code> section to see the progress of your request and to see the download URL once the request is completed.</li>
    </ol> <p>In the routes section below, there is a "Try it out" button.  After authenticating, you can select from the available parameters, and you will see the curl request performed, the results of your request, and any errors if applicable.</p> <p><i>GiveCampus Proprietary and Confidential</i></p>
basePath: "/api"
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
    description: Enter the token with the `Bearer ` prefix, e.g. "Bearer XXXXXXXXXXXXX".
paths:
  "/imported_gifts":
    get:
      tags:
      - Retrieve a list of imported gifts
      summary: Find your imported gifts
      description: |-
        <p>This endpoint will submit a request to retrieve imported gifts based on the supplied parameters.</p> <p>The results of this request is a JSON object that contains the following:</p>
          <ol>
            <li>request_id</li>
            <li>state</li>
          </ol>
        <p>Once you receive the <code>request_id</code>, you can make a subsequent request to the <code>results</code> operation listed on this page.</p> <p>You will take this id to check the <code>state</code> of the request and once it is <code>completed</code> you will have a valid <code>download_url</code> that will contain the data from the original imported gifts request</p>
      operationId: findImportedGifts
      produces:
      - application/json
      security:
      - Bearer: []
      responses:
        '200':
          description: returns a request id that can be used to make further requests
          schema:
            "$ref": "#/definitions/ApiRequest"
        '400':
          description: Invalid request
    post:
      tags:
      - Bulk-create imported gifts for your school
      summary: Create imported gifts
      description: |-
        <p>This endpoint allows you to create imported gifts.</p> <p>
          <strong>Please ensure that your team is aware of any API requests submitted using this tool, and can delete after testing.</strong>
        </p> <p><strong>Note:</strong> You can only create up tp 5,000 imported gifts per request.</p>
      operationId: createImportedGifts
      produces:
      - application/json
      parameters:
      - in: body
        name: Create Imported Gift Details
        schema:
          type: array
          items:
            allOf:
            - "$ref": imported_gift_object_part_1.yaml
            - "$ref": imported_gift_object_part_2.yaml
            - "$ref": imported_gift_object_part_3.yaml
      security:
      - Bearer: []
      responses:
        '200':
          description: returns a request id that can be used to make further requests
          schema:
            "$ref": "#/definitions/ApiRequest"
        '400':
          description: Invalid request
    put:
      tags:
      - Bulk-update imported gifts for your school
      summary: Update imported gifts
      description: |-
        <p>This endpoint allows you to update imported gifts.</p> <p>You supply the Imported Gift ID that you can retrieve from the GET endpoint above as <code>id</code> in the request body</p> <p>
          <strong>For designations, if you supply an empty array, the API will remove any designation selections for imported gifts.  If you include designations in the PUT, the API will replace any existing designation selections with the ones provided in the request.</strong>
        </p> <p><strong>Note:</strong> You can only update up tp 5,000 imported gifts per request.</p>
      operationId: updateImportedGifts
      produces:
      - application/json
      parameters:
      - in: body
        name: Updated Imported Gift Details
        schema:
          type: array
          items:
            allOf:
            - "$ref": imported_gift_object_part_1.yaml
            - type: object
              properties:
                id:
                  description: GiveCampus ID for the imported gift
                  example: 100
                  type: integer
            - "$ref": imported_gift_object_part_2.yaml
            - "$ref": imported_gift_object_part_3.yaml
      security:
      - Bearer: []
      responses:
        '200':
          description: returns a request id that can be used to make further requests
          schema:
            "$ref": "#/definitions/ApiRequest"
        '400':
          description: Invalid request
  "/results/{request_id}":
    get:
      tags:
      - Results
      summary: Get your results
      description: Returns the results of your request, like imported gifts
      operationId: findResults
      produces:
      - application/json
      parameters:
      - in: path
        name: request_id
        schema:
          type: string
        required: true
        description: Request ID
      security:
      - Bearer: []
      responses:
        '200':
          description: returns a status and download url for your request
          schema:
            "$ref": "#/definitions/ApiResults"
        '202':
          description: returns a status for your request
          schema:
            "$ref": "../shared/types/in_progress_api_results.yaml"
        '400':
          description: Invalid request
definitions:
  GetImportedGifts:
    description: The following fields are returned per imported gift in an array in
      the downloaded file from the Imported Gifts API
    allOf:
    - "$ref": imported_gift_object_part_1.yaml
    - type: object
      properties:
        id:
          description: GiveCampus ID for the imported gift
          example: 100
          type: integer
    - "$ref": imported_gift_object_part_2.yaml
    - type: object
      properties:
        timestamps:
          description: Times associated to the imported gift
          type: object
          properties:
            created_at:
              description: Timestamp for when the imported gift was created in Unix
                time
              example: 1672549200
              type: integer
            updated_at:
              description: Timestamp for the last time the imported gift was updated
                in Unix time
              example: 1672549200
              type: integer
    - "$ref": imported_gift_object_part_3.yaml
  ApiRequest:
    "$ref": "../shared/types/api_request.yaml"
  ApiResults:
    "$ref": "../shared/types/api_results.yaml"
