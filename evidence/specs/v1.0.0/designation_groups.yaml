---
swagger: '2.0'
info:
  version: 1.0.0
  title: GiveCampus Designation Groups API
  description: |-
    The Designation Groups API allows your school to securely retrieve and create designation group data in JSON format. <h2>Security</h2> <p>Every API request must have a bearer token attached in the Authorization header.</p> <p>These tokens are generated within the GiveCampus UI and only school administrators with super-user permissions can generate and manage them. You will choose this initial set of “full” administrators during the GiveCampus onboarding process.</p> <p>All API responses will be delivered over a secure HTTPS connection, and a TLS version of 1.2 or 1.3 is required.</p> <p>GiveCampus maintains detailed logs of API access and can provide them to your team upon request.</p> <h2>Request Lifecycle</h2> <p>The API delivers data asynchronously using a request-and-poll pattern:</p> <ol>
      <li><strong>Submit your request</strong> — Call the endpoint with your desired parameters. You'll receive a <code>request_id</code> and a <code>status</code> of <code>in_progress</code>.</li>
      <li><strong>Poll for results</strong> — Call <code>/results/{request_id}</code> every 2–5 seconds until <code>status</code> changes to <code>completed</code> (or <code>error</code>).</li>
      <li><strong>Download your data</strong> — When complete, the response includes a <code>download_url</code> containing a JSON array of objects matching the model defined below.</li>
    </ol> <p>Most requests complete within a few seconds.</p> <h2>Testing</h2> <p>You can use the tools below to see responses from the API to understand how to build your own implementation.</p> <p>You will see the URLs and paths necessary to make your own API calls.</p> <ol>
      <li>Click the Authorize button below to enter in your API Key in the following format: <code>Bearer API_TOKEN</code></li>
      <li>After authorized, you can click the close button in the authorization modal to start making requests</li>
      <li>Expand the Designation Groups section below to see the available parameters that you can leverage to filter API results.</li>
      <li>After requesting a subset of designation groups, you will receive a <code>request_id</code>.  Copy that ID and then use that in the <code>results</code> section to see the progress of your request and to see the download URL once the request is completed.</li>
    </ol> <p>In the routes section below, there is a "Try it out" button.  After authenticating, you can select from the available parameters, and you will see the curl request performed, the results of your request, and any errors if applicable.</p> <p><i>GiveCampus Proprietary and Confidential</i></p>
basePath: "/api"
securityDefinitions:
  Bearer:
    type: apiKey
    name: Authorization
    in: header
    description: Enter the token with the `Bearer ` prefix, e.g. "Bearer XXXXXXXXXXXXX".
paths:
  "/designation_groups":
    get:
      tags:
      - Retrieve a list of designation groups
      summary: Find your designation groups
      description: |-
        <p>This endpoint will submit a request to retrieve designation groups based on the supplied parameters.</p> <p>The results of this request is a JSON object that contains the following:</p>
          <ol>
            <li>request_id</li>
            <li>state</li>
          </ol>
        <p>Once you receive the <code>request_id</code>, you can make a subsequent request to the <code>results</code> operation listed on this page.</p> <p>You will take this id to check the <code>state</code> of the request and once it is <code>completed</code> you will have a valid <code>download_url</code> that will contain the data from the original designation groups request</p>
      operationId: findDesignationGroups
      produces:
      - application/json
      security:
      - Bearer: []
      responses:
        '200':
          description: returns a request id that can be used to make further requests
          schema:
            "$ref": "#/definitions/ApiRequest"
        '400':
          description: Invalid request
    post:
      tags:
      - Bulk-create designations groups for your school
      summary: Create designation groups
      description: |-
        <p>This endpoint allows you to create designation groups.</p> <p>
          <strong>IMPORTANT: Submitting this request will create real designation groups for your school such that anyone reviewing designation groups will see them in the GiveCampus system.</strong>
        </p> <p>
          <strong>Please ensure that your team is aware of any API requests submitted using this tool, and can delete after testing.</strong>
        </p> <p><strong>Note:</strong> You can only create up tp 5,000 designation groups per request.</p>
      operationId: createDesignationGroups
      produces:
      - application/json
      security:
      - Bearer: []
      responses:
        '200':
          description: returns a request id that can be used to make further requests
          schema:
            "$ref": "#/definitions/ApiRequest"
        '400':
          description: Invalid request
      parameters:
      - in: body
        name: Designation Groups Details
        schema:
          type: array
          items:
            type: object
            properties:
              name:
                example: New Designation Group
                description: Name of the designation group
                type: string
              description:
                example: New Designation Group Description
                description: Description of the designation group
                type: string
              designation_id:
                example: 100
                description: When <code>group</code> is set to <code>true</code>,
                  the designation_id denotes an existing designation that is assigned
                  as the Program Priority in the GiveCampus system. If the child node
                  is not a group, the designation_id defines an existing designation
                  that should be included as a node the in designation group.
                type: integer
              group:
                description: When creating a group or any child groups, set this value
                  to true
                type: boolean
              children:
                description: An array of objects that you would like to place under
                  the created designation group.  These items can be either either
                  designation groups, or singular designations
                type: array
                items:
                  type: object
                  properties:
                    name:
                      example: Child Designation Name
                      description: When <code>group</code> is set to <code>true</code>,
                        this is the name of the designation group.  If the child node
                        is not a group, then you do not have to provide this value.
                      type: string
                    designation_id:
                      example: 200
                      description: When <code>group</code> is set to <code>true</code>,
                        the designation_id denotes an existing designation that is
                        assigned as the Program Priority in the GiveCampus system.
                        If the child node is not a group, the designation_id defines
                        an existing designation that should be included as a node
                        the in designation group.
                      type: integer
                    group:
                      example: false
                      description: When creating a group or any child groups, you
                        set this value to true
                      type: boolean
  "/results/{request_id}":
    get:
      tags:
      - Results
      summary: Get your results
      description: Returns the results of your request, like designation groups
      operationId: findResults
      produces:
      - application/json
      parameters:
      - in: path
        name: request_id
        schema:
          type: string
        required: true
        description: Request ID
      security:
      - Bearer: []
      responses:
        '200':
          description: returns a status and download url for your request
          schema:
            "$ref": "#/definitions/ApiResults"
        '202':
          description: returns a status for your request
          schema:
            "$ref": "../shared/types/in_progress_api_results.yaml"
        '400':
          description: Invalid request
definitions:
  GetDesignationGroups:
    description: The following fields are returned per designation group in an array
      in the downloaded file from the Designation Groups API.  The results of each
      node below the first level that can be associated to a designation group can
      be either another designation group or a designation.  Each object in the <code>children</code>
      array matches the object description below.
    "$ref": designation_group_object.yaml
  PostDesignationGroups:
    description: The following fields are are returned per designation group in an
      array to confirm that the designation group was created.
    type: object
    properties:
      error_count:
        description: If any errors, the number will be reported in this field.
        type: integer
      items:
        description: The designation groups created will be returned in an array for
          review
        type: array
        items:
          "$ref": designation_group_object.yaml
  ApiRequest:
    "$ref": "../shared/types/api_request.yaml"
  ApiResults:
    "$ref": "../shared/types/api_results.yaml"
